<div class="auth-container">
    <div class="auth-tabs">
        <button id="tab-login" class="active">Login</button>
        <button id="tab-register">Register</button>
    </div>

    <form id="login-form" class="auth-form">
        <input type="email" id="login-email" placeholder="Email" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <button type="submit" class="primary-btn">Sign In</button>
    </form>

    <form id="register-form" class="auth-form hidden">
        <input type="text" id="reg-name" placeholder="First Name" required>
        <input type="text" id="reg-lastname" placeholder="Last Name" required>
        <input type="email" id="reg-email" placeholder="Email" required>
        <input type="password" id="reg-password" placeholder="Password (min. 6 characters)" required>
        <input type="tel" id="reg-phone" placeholder="Phone Number (Optional)">
        <textarea id="reg-address" placeholder="Full Shipping Address" required></textarea>
        
        <div class="tc-agreement">
            <input type="checkbox" id="tc-check" required>
            <label for="tc-check">I agree to the <a href="t&c_legal.html">Terms & Conditions</a></label>
        </div>
        
        <button type="submit" class="primary-btn">Create Account</button>
    </form>
</div>
