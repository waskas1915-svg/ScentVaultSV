<!DOCTYPE html>
<html>
  <head>
      <meta charset="UTF-8">
      <title>ScentVaultSV | Perfumes y Decants</title>
      <link rel="stylesheet" href="css/animation.css">
      <link rel="stylesheet" href="css/base.css">
      <link rel="stylesheet" href="css/header+cart.css">
      <link rel="stylesheet" href="css/product_grid.css">
      <link rel="stylesheet" href="css/product_detail.css">
      <link rel="stylesheet" href="css/cart.css">
      <link rel="stylesheet" href="css/checkout.css">
      <link rel="stylesheet" href="css/main_btn.css">
      <link rel="stylesheet" href="css/toast.css">
      <link rel="stylesheet" href="css/phone.css">
      <link rel="stylesheet" href="css/footer.css">
      <link rel="stylesheet" href="css/drawer.css">
      <link rel="stylesheet" href="css/auth.css">
      <link rel="stylesheet" href="css/loyalty.css">
      <link rel="stylesheet" href="css/profile.css">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>


    <header></header>

    <!-- side-drawer -->
    <div id="drawerOverlay" class="overlay"></div>
    <div id="unifiedDrawer" class="side-drawer">
        <div class="drawer-header">
            <div class="drawer-tabs">
                <span class="tab-btn" data-tab="wishlist">Wishlist(0)</span>
                <span class="tab-btn active-tab" data-tab="account">Cuenta</span>
                <span class="tab-btn" data-tab="cart">Bag(<span id="bag-count">0</span>)</span>
            </div>
            <button id="closeDrawerBtn" class="close-x">×</button>
        </div>

        <div id="drawerContent" class="drawer-content"></div>
    </div>

    <!-- Main Content -->
    <main>
      <div id="products"></div>
    </main>

    <!-- toast container -->
    <div id="toastContainer"></div>

    <script type="module" src="./js/app.js"></script>
    <script type="module">
        import { initHeader } from './js/header.js';
        initHeader();
        import { initFooter } from './js/footer.js';
        window.addEventListener('DOMContentLoaded', () => {
            initFooter();
        });
    </script>
  </body>

</html>
